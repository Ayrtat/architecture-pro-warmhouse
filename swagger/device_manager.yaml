openapi: 3.0.3
info:
  title: Smart Home API
  version: 1.0.0
  description: API for managing smart home devices (registration, state, commands).
  contact:
    name: Warm Home Team
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080/api/v2

paths:
  /devices/health:
    get:
      summary: Health check endpoint
      description: Check if the service is healthy
      tags: [health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: boolean
                  message:
                    type: string

  /devices:
    get:
      summary: Get all devices
      description: Get a list of all registered devices with optional filtering
      tags: [devices]
      parameters:
        - in: query
          name: filter
          schema:
            type: string
          description: Filter in format [key="value"]
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  message:
                    type: string
        '400':
          description: Invalid filter format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Register a new device
      description: Register a new device in the system
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Device successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Device'
                  message:
                    type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/{id}:
    get:
      summary: Get a specific device
      description: Get details of a specific device by ID
      tags: [devices]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Device ID
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Device'
                  message:
                    type: string
        '400':
          description: Invalid device ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unregister a device
      description: Remove a device from the system
      tags: [devices]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Device ID
      responses:
        '200':
          description: Device successfully unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid device ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/{id}/state:
    get:
      summary: Get device state
      description: Get the current state of a device
      tags: [devices]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Device ID
      responses:
        '200':
          description: Current device state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeviceState'
                  message:
                    type: string
        '400':
          description: Invalid device ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update device state
      description: Update the state of a device
      tags: [devices]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Device ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceState'
      responses:
        '200':
          description: Device state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/{id}/commands:
    post:
      summary: Send command to device
      description: Send a command to a device
      tags: [devices]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Device ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommand'
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeviceCommand'
                  message:
                    type: string
        '400':
          description: Invalid command or arguments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Command not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        type:
          type: string
          enum: [thermostat, unknown]
        functionality:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCommandDesc'
        metadata:
          type: object
          additionalProperties:
            type: string
        last_seen:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeviceRegistration:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [thermostat, unknown]
        metadata:
          type: object
          additionalProperties:
            type: string
        functionality:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCommandDesc'

    DeviceCommandDesc:
      type: object
      properties:
        name:
          type: string
        parametersType:
          type: array
          items:
            type: string
        returnType:
          type: string
        description:
          type: string

    DeviceState:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, unknown]
        last_updated:
          type: string
          format: date-time
        temperature:
          type: number
          format: float
        temperature_unit:
          type: string
          enum: [celsius, fahrenheit]

    DeviceCommand:
      type: object
      required:
        - name
        - parameters
      properties:
        name:
          type: string
        parameters:
          type: array
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
