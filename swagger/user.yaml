openapi: 3.0.3
info:
  title: Smart Home API
  version: 1.0.0
  description: API for user management and authentication
  contact:
    name: Warm Home Team
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080/api/v2

paths:
  /api/v2/users:
    post:
      summary: Create a new user
      description: Creates a new user in the system
      tags:
        - Users
      requestBody:
        required: true
        description: User creation data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get list of users
      description: Returns a list of all users (admin only)
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of users per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: List of users successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/{id}:
    get:
      summary: Get user information
      description: Returns detailed information about a user by their ID
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int64
            example: 123
      responses:
        '200':
          description: User information successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User with specified ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user information
      description: Updates user information
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int64
            example: 123
      requestBody:
        required: true
        description: User update data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User information successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User with specified ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete user
      description: Deletes a user from the system
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: integer
            format: int64
            example: 123
      responses:
        '204':
          description: User successfully deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User with specified ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/login:
    post:
      summary: User authentication
      description: Authenticates user and returns JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        description: Login credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/refresh:
    post:
      summary: Refresh access token
      description: Refreshes JWT token using refresh token
      tags:
        - Authentication
      requestBody:
        required: true
        description: Refresh token for renewal
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/auth/logout:
    post:
      summary: Logout
      description: Logs out user and invalidates tokens
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully logged out"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/me:
    get:
      summary: Get current user information
      description: Returns information about the currently authenticated user
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      description: User information
      required:
        - ID
        - Email
        - FirstName
        - LastName
        - Role
        - IsActive
        - CreatedAt
        - LastUpdated
      properties:
        ID:
          type: integer
          format: int64
          description: Unique user identifier
          example: 123
        Email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        FirstName:
          type: string
          description: User first name
          example: "John"
          maxLength: 50
        LastName:
          type: string
          description: User last name
          example: "Doe"
          maxLength: 50
        Role:
          type: string
          enum: [user, admin]
          description: User role in the system
          example: "user"
        IsActive:
          type: boolean
          description: Whether the user is active
          example: true
        CreatedAt:
          type: string
          format: date-time
          description: User creation date and time
          example: "2024-01-15T10:30:00Z"
        LastUpdated:
          type: string
          format: date-time
          description: Last update date and time
          example: "2024-01-20T14:45:00Z"
        LastLogin:
          type: string
          format: date-time
          description: Last login date and time
          example: "2024-01-25T09:15:00Z"

    CreateUserRequest:
      type: object
      description: Data for creating a new user
      required:
        - Email
        - Password
        - FirstName
        - LastName
      properties:
        Email:
          type: string
          format: email
          description: User email address
          example: "newuser@example.com"
        Password:
          type: string
          format: password
          description: User password
          example: "SecurePassword123!"
          minLength: 8
          maxLength: 100
        FirstName:
          type: string
          description: User first name
          example: "Jane"
          maxLength: 50
        LastName:
          type: string
          description: User last name
          example: "Smith"
          maxLength: 50
        Role:
          type: string
          enum: [user, admin]
          description: User role (defaults to 'user')
          example: "user"
          default: "user"

    UpdateUserRequest:
      type: object
      description: Data for updating a user
      properties:
        FirstName:
          type: string
          description: User first name
          example: "Jane"
          maxLength: 50
        LastName:
          type: string
          description: User last name
          example: "Smith"
          maxLength: 50
        Role:
          type: string
          enum: [user, admin]
          description: User role
          example: "user"
        IsActive:
          type: boolean
          description: Whether the user is active
          example: true

    UsersList:
      type: object
      description: List of users with pagination
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          description: Array of users
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          description: Pagination information
          required:
            - page
            - limit
            - total
            - totalPages
          properties:
            page:
              type: integer
              description: Current page
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total:
              type: integer
              description: Total number of users
              example: 25
            totalPages:
              type: integer
              description: Total number of pages
              example: 3

    LoginRequest:
      type: object
      description: Login credentials
      required:
        - Email
        - Password
      properties:
        Email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        Password:
          type: string
          format: password
          description: User password
          example: "SecurePassword123!"

    LoginResponse:
      type: object
      description: Response after successful authentication
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Token for refreshing access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          description: Token type
          example: "Bearer"
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      description: Token refresh request
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token for renewal
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    Error:
      type: object
      description: Error information
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Error description
          example: "Invalid email format"
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: Error occurrence time
          example: "2024-01-25T10:30:00Z"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for user authorization

security:
  - BearerAuth: []

tags:
  - name: Users
    description: Operations for user management
  - name: Authentication
    description: Operations for authentication and authorization
